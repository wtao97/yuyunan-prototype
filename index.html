  .legacy-panel.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .legacy-title {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 3.2vh;
    min-height: 27px;
    padding: 0 .8vw;
    font-size: calc(var(--font) * 1.05);
    font-weight: 700;
    color: #edf8ff;
    text-shadow: 0 0 5px rgba(44,174,255,.34);
  }
  .legacy-title::before {
    content: "";
    width: 0; height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 8px solid #36bfff;
    filter: drop-shadow(0 0 3px rgba(42,174,255,.7));
  }
  .legacy-body {
    padding: .8vh .8vw;
    font-size: calc(var(--font) * .93);
    line-height: 1.9;
    color: #82b9d6;
  }
  .legacy-row { display: flex; gap: 8px; min-height: 30px; }
  .legacy-label { flex: 0 0 auto; color: #77b3d3; }
  .legacy-value { color: #e5eef4; }
  .legacy-value.em { font-weight: 700; color: #e5eef4; }
  .process-trigger {
    position: absolute;
    z-index: 50;
    left: 23.8%;
    top: 58.2%;
    width: 8.8%;
    height: 8.8%;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    outline: none;
  }
  .process-trigger:focus-visible {
    border: 1px dashed rgba(50,228,255,.7);
    box-shadow: 0 0 7px rgba(50,228,255,.35);
  }
  .panel-head {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3.0vh;
    min-height: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 .8vw;
  }
  .panel-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    color: #e1f4ff;
    font-size: calc(var(--font) * 1.08);
    font-weight: 700;
    letter-spacing: .04em;
    white-space: nowrap;
    text-shadow: 0 0 5px rgba(41, 164, 255, .35);
  }
  .panel-title::before {
    content: "";
    display: inline-block;
    width: 0; height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 8px solid #36bfff;
    filter: drop-shadow(0 0 3px rgba(42, 174, 255, .7));
  }
  .state-select {
    max-width: 48%;
    height: 22px;
    padding: 0 5px;
    border: 1px solid rgba(44, 155, 218, .68);
    border-radius: 3px;
    outline: none;
    color: #9cdbff;
    background: rgba(0, 34, 58, .85);
    font: 11px "Microsoft YaHei", sans-serif;
    cursor: pointer;
  }
  .state-select option { color: #d8efff; background: #082a43; }
  .status-bar {
    position: absolute;
    top: 3.1vh;
    left: .7vw;
    right: .7vw;
    height: 3.8vh;
    min-height: 31px;
    padding: 0 .55vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-radius: 4px;
    background: rgba(14, 72, 103, .43);
    color: var(--muted);
    font-size: calc(var(--font) * .92);
    white-space: nowrap;
  }
  .status-left, .status-right { min-width: 0; }
  .status-value { color: var(--cyan); font-weight: 700; }
  .timeline-scroll {
    position: absolute;
    top: 7.25vh;
    left: 0;
    right: 0;
    bottom: 0;
    padding: .1vh .8vw 1.1vh .7vw;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(50, 196, 246, .38) transparent;
  }
  .timeline-scroll::-webkit-scrollbar { width: 5px; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: rgba(50, 196, 246, .35); border-radius: 5px; }
  .main-step {
    position: relative;
    margin: 0 0 .8vh 0;
    min-width: 0;
  }
  .main-step:not(:last-child)::after {
    content: "";
    position: absolute;
    z-index: 0;
    left: 13px;
    top: 28px;
    bottom: -22px;
    width: 2px;
    background: linear-gradient(to bottom, rgba(39, 226, 255, .88), rgba(30, 146, 206, .36));
    box-shadow: 0 0 4px rgba(18, 191, 255, .24);
  }
  .main-icon {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .main-icon.done {
    border: 2px solid #42eaff;
    background: #0ac8ed;
    box-shadow: 0 0 0 2px rgba(4, 25, 43, .92), 0 0 8px rgba(35, 218, 255, .6), inset 0 0 4px rgba(255,255,255,.4);
  }
  .main-icon.done::after {
    content: "";
    width: 8px;
    height: 4px;
    border-left: 2px solid #06334b;
    border-bottom: 2px solid #06334b;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .main-icon.progress {
    border: 2px solid #1fdcff;
    background: rgba(4, 50, 78, .94);
    box-shadow: 0 0 0 2px rgba(4, 25, 43, .92), 0 0 9px rgba(35, 218, 255, .58);
    animation: ringPulse 2s ease-in-out infinite;
  }
  .main-icon.progress::after {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #f1fbff;
    box-shadow: 0 0 7px #30dfff;
  }
  @keyframes ringPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(4,25,43,.92), 0 0 6px rgba(35,218,255,.38); }
    50% { box-shadow: 0 0 0 2px rgba(4,25,43,.92), 0 0 12px rgba(35,218,255,.8); }
  }
  .step-content {
    position: relative;
    z-index: 1;
    margin-left: 37px;
    padding: 0 0 .8vh 0;
    border-bottom: 1px solid rgba(64, 163, 204, .23);
    min-width: 0;
  }
  .main-step:last-child .step-content { border-bottom: 0; padding-bottom: 0; }
  .step-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    min-height: 23px;
    line-height: 1.35;
  }
  .step-title {
    min-width: 0;
    color: #e0f4ff;
    font-size: calc(var(--font) * 1.03);
    font-weight: 700;
    white-space: nowrap;
    text-shadow: 0 0 5px rgba(41, 154, 255, .42);
  }
  .step-right {
    flex: 0 0 auto;
    color: #80c9ff;
    font-size: calc(var(--font) * .83);
    text-align: right;
    white-space: nowrap;
  }
  .step-right.active { color: var(--cyan); font-weight: 700; }
  .details { margin-top: 3px; }
  .detail-line {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin-top: 3px;
    font-size: calc(var(--font) * .88);
    line-height: 1.42;
    min-width: 0;
  }
  .detail-label { flex: 0 0 auto; color: #a6cce4; white-space: nowrap; }
  .detail-value { flex: 1 1 auto; min-width: 0; color: #e0f0fb; overflow-wrap: anywhere; }
  .detail-value.highlight { color: var(--cyan); font-weight: 600; }
  .detail-value.false-alarm { color: var(--cyan); font-weight: 700; }
  .subflow { margin-top: 5px; }
  .subflow-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 0 5px;
    border: 0;
    color: #50d9ff;
    background: transparent;
    font: 700 calc(var(--font) * .9) "Microsoft YaHei", sans-serif;
    cursor: pointer;
    text-shadow: 0 0 4px rgba(33, 172, 255, .28);
  }
  .subflow-toggle .chevron { display: inline-block; width: 14px; font-size: 12px; line-height: 1; text-align: center; }
  .subflow-list {
    border-top: 1px solid rgba(64, 163, 204, .22);
    padding-top: 5px;
  }
  .substep {
    position: relative;
    display: grid;
    grid-template-columns: 21px minmax(0, 1fr);
    column-gap: 5px;
    padding: 0 0 7px 0;
    margin: 0 0 3px 0;
  }
  .substep:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 12px;
    bottom: -3px;
    width: 2px;
    background: linear-gradient(to bottom, rgba(61, 192, 245, .62), rgba(61, 192, 245, .18));
  }
  .subdot {
    position: relative;
    z-index: 1;
    width: 11px;
    height: 11px;
    margin: 2px 0 0 2px;
    border: 2px solid #35bfff;
    border-radius: 50%;
    background: #e9faff;
    box-shadow: 0 0 5px rgba(49, 180, 255, .58);
  }
  .subdot.current { background: #f4fdff; border-color: #3ce3ff; box-shadow: 0 0 8px rgba(42, 222, 255, .9); }
  .substep-name {
    color: #e0f1fc;
    font-size: calc(var(--font) * .88);
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .substep-meta {
    display: flex;
    flex-wrap: wrap;
    column-gap: 12px;
    row-gap: 1px;
    color: #9ecbe7;
    font-size: calc(var(--font) * .78);
    line-height: 1.4;
  }
  .substep-content {
    margin-top: 1px;
    color: #b7d8ed;
    font-size: calc(var(--font) * .8);
    line-height: 1.42;
    overflow-wrap: anywhere;
  }
  .substep-content .detail-label { color: #9ecbe7; }
  .event-complete .step-content { border-bottom: 0; }
  @media (max-width: 1100px) {
    .panel-title { font-size: 13px; }
    .state-select { max-width: 52%; font-size: 10px; }
    .status-bar { font-size: 11px; }
    .step-title { font-size: 12px; }
    .step-right { font-size: 10px; }
    .detail-line { font-size: 11px; }
    .substep-name { font-size: 11px; }
    .substep-meta, .substep-content { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .main-icon.progress { animation: none; } }

  /* 左侧详情缺失数据补齐：仅覆盖截图中未加载出的“值”，不覆盖原有标签/经纬度 */
  .left-data-fill {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    font-size: clamp(14px, 1.15vw, 20px);
    line-height: 1.55;
    text-shadow: 0 0 2px rgba(0, 20, 35, .25);
  }
  .left-data-fill .cyan { color: #55e8eb; }
  .left-data-fill .white { color: #eef5f8; }
  .fill-plate   { left: 19.6%; top: 14.8%; }
  .fill-status  { left: 19.6%; top: 19.6%; }
  .fill-driver  { left: 19.6%; top: 24.4%; }
  .fill-escort  { left: 19.6%; top: 29.2%; }

  .fill-origin  { left: 6.2%; top: 42.4%; width: 24.5%; }
  .fill-dest    { left: 6.2%; top: 47.1%; width: 24.8%; }
  .fill-feature { left: 6.2%; top: 51.7%; width: 24.5%; }
  .fill-cargo   {
    left: 6.2%;
    top: 56.1%;
    width: 24.8%;
    font-size: clamp(13px, 1.03vw, 18px);
    line-height: 1.55;
  }

  /* 旧企业处置情况面板不再作为默认状态出现 */
  .legacy-panel { display: none !important; }

  /* v1.3：左侧下半区重新排版，避免货物信息与操作区重叠 */
  .fill-cargo { display: none !important; }

  .left-lower-reflow {
    position: absolute;
    z-index: 28;
    left: 0;
    top: 54.1%;
    width: 31.75%;
    height: 25.3%;
    box-sizing: border-box;
    padding: .55vh .85vw .65vh .25vw;
    background: rgba(78, 101, 112, .96);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    color: #eef5f8;
    pointer-events: none;
  }
  .reflow-cargo {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: .45vw;
    align-items: start;
    font-size: clamp(13px, 1.02vw, 18px);
    line-height: 1.55;
  }
  .reflow-label {
    color: #8fc4dd;
    white-space: nowrap;
  }
  .reflow-value {
    min-width: 0;
    color: #eef5f8;
    overflow-wrap: anywhere;
  }
  .reflow-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: .55vh;
    padding: 0 .2vw;
    color: #55e8eb;
    font-size: clamp(14px, 1.12vw, 20px);
    line-height: 1.5;
  }
  .reflow-divider {
    height: 2px;
    margin: .85vh .15vw .85vh;
    background: rgba(235, 244, 240, .82);
    box-shadow: 0 0 1px rgba(255,255,255,.18);
  }
  .reflow-bottom-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .9vh;
    padding-top: .15vh;
  }
  .reflow-btn {
    min-width: 68px;
    padding: .45vh .85vw;
    border-radius: 3px;
    background: #2d95ed;
    color: #fff;
    font-size: clamp(11px, .78vw, 14px);
    line-height: 1.2;
    text-align: center;
    box-shadow: 0 0 3px rgba(31,135,229,.28);
  }

  /* 左侧“处置流程>>>”本身作为点击开关，跟随重新排版后的操作区 */
  .process-trigger {
    z-index: 60;
    left: 23.9%;
    top: 65.15%;
    width: auto;
    height: auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: #55e8eb;
    font: 400 clamp(14px, 1.12vw, 20px)/1.5 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    cursor: pointer;
    text-shadow: 0 0 2px rgba(0,20,35,.2);
  }

  /* v1.3：右侧流程面板改为接近左侧面板的蓝灰色与透明度，不再使用深色渐变 */
  .workflow-panel {
    border-color: rgba(145, 202, 225, .30);
    background-image:
      linear-gradient(rgba(35, 66, 82, .68), rgba(35, 66, 82, .68)),
      var(--workflow-map-bg);
  }

  /* v1.3：使用线性 chevron，不使用实心三角字符 */
  .subflow-toggle .chevron {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-left: 1px;
    border-right: 2px solid #50d9ff;
    border-bottom: 2px solid #50d9ff;
    font-size: 0;
    line-height: 0;
    transition: transform .12s ease;
    transform-origin: 50% 50%;
  }
  .subflow-toggle .chevron.down { transform: rotate(45deg) translateY(-1px); }
  .subflow-toggle .chevron.up   { transform: rotate(-135deg) translate(-1px, -1px); }


  /* v1.4：左侧车辆详情面板整体重绘，不再叠加在旧截图文字之上 */
  .vehicle-panel {
    position: absolute;
    z-index: 15;
    left: 0;
    top: 12.9%;
    width: 31.8%;
    height: 76.8%;
    overflow: hidden;
    box-sizing: border-box;
    padding: 1.1vh 0 .8vh 0;
    border: 1px solid rgba(193, 225, 239, .34);
    border-left: 0;
    border-radius: 0 7px 7px 0;
    background: rgba(60, 85, 100, .90);
    color: #e6f2f7;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  .vehicle-top {
    display: flex;
    align-items: flex-start;
    gap: 1.75vw;
    padding: 0 1vw 0 1.7vw;
  }
  .vehicle-photo {
    display: block;
    flex: 0 0 14.55vw;
    width: 14.55vw;
    height: 21.6vh;
    object-fit: cover;
    border: 0;
    border-radius: 0;
  }
  .vehicle-meta {
    min-width: 0;
    flex: 1;
    padding-top: 1.1vh;
    display: flex;
    flex-direction: column;
    gap: 2.15vh;
    font-size: clamp(14px, 1.08vw, 18px);
    line-height: 1.35;
    white-space: nowrap;
  }
  .vehicle-meta-row {
    display: flex;
    align-items: baseline;
    gap: .25vw;
  }
  .field-label { color: #91c2d9; white-space: nowrap; }
  .field-value { min-width: 0; }
  .field-value.cyan { color: #55e5e8; }
  .field-value.white { color: #eef4f6; }
  .vehicle-coordinates {
    display: grid;
    grid-template-columns: 18.0vw minmax(0, 1fr);
    align-items: baseline;
    margin-top: 1.7vh;
    font-size: clamp(14px, 1.08vw, 18px);
    line-height: 1.45;
    white-space: nowrap;
  }
  .coordinate-item { display: flex; align-items: baseline; gap: .25vw; }
  .vehicle-location {
    display: flex;
    align-items: baseline;
    gap: .25vw;
    padding-right: .5vw;
    font-size: clamp(14px, 1.08vw, 18px);
    line-height: 1.45;
  }
  .vehicle-location .field-label { flex: 0 0 6.85vw; }
  .vehicle-location .field-value { overflow-wrap: anywhere; }
  .vehicle-location.origin { margin-top: 2.55vh; }
  .vehicle-location.destination { margin-top: 1.55vh; }
  .vehicle-location.feature { margin-top: 1.55vh; }
  .vehicle-location.cargo {
    margin-top: 1.3vh;
    align-items: flex-start;
    font-size: clamp(12px, .9vw, 14px);
    line-height: 1.42;
  }
  .vehicle-location.cargo .field-label { flex-basis: 6.85vw; }
  .vehicle-location.cargo .field-value { flex: 1; }
  .vehicle-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: .55vh;
    padding: 0 .45vw 0 .15vw;
    min-height: 2.8vh;
  }
  .vehicle-link, .process-trigger {
    position: static;
    display: inline-block;
    flex: 0 0 auto;
    width: auto;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #55e5e8;
    font: 400 clamp(14px, 1.08vw, 18px)/1.45 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;

    white-space: nowrap;
    cursor: pointer;
  }
  .vehicle-link:focus-visible, .process-trigger:focus-visible {
    outline: 1px dashed rgba(50, 228, 255, .85);
    outline-offset: 2px;
  }
  .vehicle-divider {
    height: 2px;
    margin: 1.15vh .6vw 0 .45vw;
    background: rgba(235, 244, 240, .82);

  .vehicle-bottom-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.0vh;
    margin-top: 3.2vh;

  .vehicle-action {
    min-width: 4.4vw;
    height: 3.2vh;
    padding: 0 .65vw;
    border: 0;
    border-radius: 3px;
    background: #2d95ed;
    color: #fff;
    font: 400 clamp(11px, .78vw, 14px)/1 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    cursor: pointer;

  /* Remove the prior screenshot-overlay patch elements; all left-side content is native HTML now. */

  /* v1.5：左侧面板高度拉高，避免底部按钮显示不完整 */

    height: 76.8%;

  /* v1.5：右侧主流程节点图标改为更接近上周原型的样式 */
  .main-step:not(:last-child)::after {
    left: 12px;
    top: 26px;
    bottom: -20px;
    width: 2px;
    background: linear-gradient(to bottom, rgba(55, 225, 255, .92), rgba(25, 153, 213, .35));
    box-shadow: 0 0 4px rgba(54, 212, 255, .24);
  }

  .main-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #45e3ff;
    background: linear-gradient(180deg, #49ebff 0%, #16c8ee 100%);
    box-shadow:
      0 0 0 2px rgba(7, 33, 52, .94),
      0 0 8px rgba(44, 220, 255, .42),
      inset 0 1px 3px rgba(255, 255, 255, .28);
  }

  .main-icon.done::after {
    content: "";
    width: 7px;
    height: 4px;
    border-left: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  .main-icon.progress {
    background: rgba(7, 55, 84, .95);
    border-color: #3fe0ff;
    box-shadow:
      0 0 0 2px rgba(7, 33, 52, .94),
      0 0 10px rgba(48, 223, 255, .58);
    animation: ringPulseV15 1.9s ease-in-out infinite;
  }

  .main-icon.progress::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 2px solid rgba(95, 236, 255, .92);
  }

  .main-icon.progress::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #e8fbff;
    box-shadow: 0 0 6px rgba(66, 231, 255, .95);
  }

  @keyframes ringPulseV15 {
    0%, 100% {
      box-shadow:
        0 0 0 2px rgba(7, 33, 52, .94),
        0 0 7px rgba(48, 223, 255, .38);
    }
    50% {
      box-shadow:
        0 0 0 2px rgba(7, 33, 52, .94),
        0 0 12px rgba(48, 223, 255, .75);
    }
  }

          <span class="subdot ${item.current ? 'current' : ''}"></span>
          <div class="substep-body">
            <div class="substep-name">${item.name}</div>
            <div class="substep-meta">
              <span>办理时间：${item.time}</span>
              <span>处理人：${item.person}</span>
            </div>
            <div class="substep-content"><span class="detail-label">处理内容：</span>${item.content}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}
function renderStep(step, index, total) {
  const icon = `<span class="main-icon ${step.type === 'progress' ? 'progress' : 'done'}" aria-hidden="true"></span>`;
  const rightClass = step.active ? 'step-right active' : 'step-right';
  return `<article class="main-step ${step.className || ''}">
    ${icon}
    <div class="step-content">
      <div class="step-head">
        <div class="step-title">${step.title}</div>
        <div class="${rightClass}">${step.right || ''}</div>
      </div>
      ${renderDetails(step.details)}
      ${renderSubflow(step.subflow)}
    </div>
  </article>`;
}
function renderState(key) {
  const state = flowData[key] || flowData.complete;
  document.getElementById('currentStatus').textContent = state.status;
  document.getElementById('totalDuration').textContent = state.duration;
  document.getElementById('timeline').innerHTML = state.steps.map(renderStep).join('');
  document.querySelectorAll('.subflow-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const expanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!expanded));
      const list = button.nextElementSibling;
      list.hidden = expanded;
      button.querySelector('.toggle-label').textContent = expanded ? '展开办理流程' : '收起办理流程';
      const chevron = button.querySelector('.chevron');
      chevron.className = expanded ? 'chevron down' : 'chevron up';
    });
  });
  document.getElementById('timeline').scrollTop = 0;
}
const workflowPanel = document.getElementById('workflowPanel');
const processTrigger = document.getElementById('processTrigger');
function setWorkflowOpen(open) {
  workflowPanel.classList.toggle('is-open', open);
  workflowPanel.setAttribute('aria-hidden', String(!open));
  processTrigger.setAttribute('aria-expanded', String(open));
}
processTrigger.addEventListener('click', () => {
  setWorkflowOpen(!workflowPanel.classList.contains('is-open'));
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && workflowPanel.classList.contains('is-open')) setWorkflowOpen(false);
});

document.getElementById('stateSelector').addEventListener('change', event => renderState(event.target.value));
renderState('complete');
setWorkflowOpen(false);
</script>
</body>
</html>
